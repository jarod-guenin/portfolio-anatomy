<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<meta name="description" content="Portfolio de dessins">
<meta name="robots" content="noai, noimageai">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f5c84c' d='M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-mode="bureau">
<div id="splash" class="splash" role="dialog" aria-label="Page d'accueil"></div>
<div class="window">

  <header class="titlebar">
    <div class="tab">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#f5c84c" d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span id="tabTitle">Dessins</span>
    </div>
    <div class="spacer"></div>
    <div class="winctl" aria-hidden="true"><span>—</span><span>☐</span><span>✕</span></div>
  </header>

  <div class="toolbar">
    <div class="nav">
      <button id="btnBack" class="icon" aria-label="Retour">←</button>
      <button id="btnUp" class="icon" aria-label="Dossier parent">↑</button>
    </div>
    <nav id="crumbs" class="crumbs" aria-label="Emplacement"></nav>
    <label class="search only-bureau">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="search" type="search" placeholder="Rechercher un dessin" aria-label="Rechercher un dessin">
    </label>
    <div class="prevnext only-dossier">
      <button id="btnPrev" class="pill">‹ Précédent</button>
      <button id="btnNext" class="pill">Suivant ›</button>
    </div>
  </div>

  <div class="cmdbar only-bureau">
    <label>Trier :
      <select id="sort">
        <option value="date-desc">Date (récent)</option>
        <option value="date-asc">Date (ancien)</option>
        <option value="nom">Nom A → Z</option>
        <option value="couleur">Plus coloré</option>
        <option value="sombre">Plus sombre</option>
      </select>
    </label>
    <span class="sep">|</span>
    <span id="filterLabel">Filtre : tous</span>
    <div class="spacer"></div>
    <span id="count" class="mono dim"></span>
  </div>

  <div class="body">
    <aside id="sidebar" class="sidebar only-bureau"></aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <footer id="status" class="statusbar"></footer>
</div>
<script src="intro.js"></script>
<script src="app.js"></script>
</body>
</html>
